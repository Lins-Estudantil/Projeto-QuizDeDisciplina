<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz de Programação Web</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <h1>Quiz de Programação Web</h1>

        <section id="quiz">
            <div class="progresso"><div id="barra"></div></div>
            <p id="contador" class="contador"></p>
            <h2 id="pergunta"></h2>
            <div id="opcoes" class="opcoes"></div>
            <button id="btn-proxima" class="oculto">Próxima</button>
        </section>

        <section id="resultado" class="oculto">
            <h2>Fim do quiz!</h2>
            <p id="pontuacao" class="pontuacao"></p>
            <p id="mensagem"></p>
            <button id="btn-reiniciar">Reiniciar</button>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
